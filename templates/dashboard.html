<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Insecure Vault</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .secret-card { background: #eef; padding: 10px; margin: 10px 0; border-left: 5px solid blue; }
    </style>
</head>
<body>
    <h1>Welcome, {{ username }}!</h1>
    <p>You are logged in as User ID: <strong>{{ user_id }}</strong></p>

    <br>
    <a href="/">Back to Home</a> | <a href="/login">Logout</a>
</body>
</html>
