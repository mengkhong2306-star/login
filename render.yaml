services:
  - type: web
    name: novavault
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 wsgi:app
    healthCheckPath: /health
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/vault_secure.db
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
    disk:
      name: novavault-data
      mountPath: /var/data
      sizeGB: 1
